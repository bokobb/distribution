name: distribution_mobile
description: "Приложение торгового агента и экспедитора"
publish_to: 'none'

# Версия приложения: 1.0.0 — versionName, +1 — versionCode на Android. Сервер пишет её в журнал приложения.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  fonts:
    # Шрифт как в приложении CRM: кириллица, вшит для работы без сети.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
