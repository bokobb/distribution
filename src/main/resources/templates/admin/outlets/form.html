<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<a class="back" th:href="${f.id == null ? '/admin/outlets' : '/admin/outlets/' + f.id}"><th:block th:utext="${i16['back']}"></th:block>Назад</a>
<p class="al al--bad" role="alert" th:if="${error != null}" th:text="${error}"></p>
<form class="card" th:action="@{/admin/outlets/save}" method="post">
    <input type="hidden" name="id" th:if="${f.id != null}" th:value="${f.id}">
    <div class="card-h"><h2>Магазин</h2></div>
    <div class="card-b form">
        <label class="field">Название<input class="inp" name="name" required th:value="${f.name}" placeholder="Магазин «…»"></label>
        <label class="field">ИП / ТОО<input class="inp" name="legal" th:value="${f.legal}"></label>
        <label class="field">БИН / ИИН<input class="inp" name="bin" inputmode="numeric" th:value="${f.bin}"></label>
        <label class="field">Владелец<input class="inp" name="owner" th:value="${f.owner}"></label>
        <label class="field">Телефон<input class="inp" name="phone" type="tel" th:value="${f.phone}" placeholder="+7 7__ ___ __ __"></label>
        <label class="field field--wide">Адрес<input class="inp" name="address" th:value="${f.address}"></label>
        <label class="field">Маршрут
            <select class="sel" name="routeId">
                <option value="">без маршрута</option>
                <option th:each="r : ${routes}" th:value="${r.id}" th:text="${r.name + ' · ' + r.days + ' · ' + (r.agent != null ? r.agent.name : 'без агента')}" th:selected="${r.id == f.routeId}"></option>
            </select></label>
        <label class="field">Тип цен
            <select class="sel" name="priceTypeId" required>
                <option th:each="t : ${priceTypes}" th:value="${t.id}" th:text="${t.name}" th:selected="${t.id == f.priceTypeId}"></option>
            </select></label>
        <label class="field">Лимит долга, ₸<input class="inp" name="creditLimit" inputmode="numeric" th:value="${f.creditLimit}"></label>
        <label class="field">Отсрочка, дней<input class="inp" name="paymentDays" inputmode="numeric" th:value="${f.paymentDays}"></label>
        <label class="field">Широта<input class="inp" name="lat" inputmode="decimal" th:value="${f.lat}"><span class="hint">агент ставит точку с телефона</span></label>
        <label class="field">Долгота<input class="inp" name="lng" inputmode="decimal" th:value="${f.lng}"></label>
    </div>
    <div class="card-b acts"><button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-soft" th:href="${f.id == null ? '/admin/outlets' : '/admin/outlets/' + f.id}">Отмена</a></div>
</form>
</th:block>
</body>
</html>
