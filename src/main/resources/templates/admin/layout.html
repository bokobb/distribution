<!DOCTYPE html>
<!--/* Общая часть админки: меню, верхняя строка, выбор компании и «Смотреть как» (только владелец),
     меню пользователя (смена пароля, выход), всплывающая строка. Страница: <html th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
     и свой фрагмент content. Из модели: title, sub, sec — подсвеченный пункт меню. */-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, scripts)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title th:text="${(title != null ? title + ' — ' : '') + 'Юг Доставка'}">Юг Доставка</title>
    <link rel="icon" href="/admin/assets/logo-64.png" type="image/png">
    <link rel="apple-touch-icon" href="/admin/assets/logo-192.png">
    <link rel="preload" href="/admin/assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/admin/assets/admin.css?v=11">
</head>
<body>
<div class="app" id="app">
    <aside class="side" id="side" aria-label="Меню админки">
        <div class="side-brand">
            <a href="/admin"><img class="side-logo" src="/admin/assets/logo-64.png" alt="" width="32" height="32"><span><b>Юг Доставка</b><span class="s" th:text="${v.scopeName()}">Все компании</span></span></a>
            <button class="side-x" type="button" id="side-x" aria-label="Закрыть меню" th:utext="${i['x']}"></button>
        </div>
        <nav class="nav" aria-label="Разделы">
            <th:block th:each="g : ${menu}">
                <hr class="nav-sep" th:if="${g.separator}">
                <p class="nav-g" th:if="${!g.separator and !#strings.isEmpty(g.title)}" th:text="${g.title}">Продажи</p>
                <a th:each="s : ${g.items}" class="nav-a" th:href="${s.href()}" th:attr="aria-current=${s.key == sec} ? 'page' : null"><th:block th:utext="${i18[s.key]}"></th:block><span th:text="${s.title}">Раздел</span><b class="nav-n" th:if="${badges.get(s.key) != null and badges.get(s.key) > 0}" th:text="${badges.get(s.key)}">0</b></a>
            </th:block>
        </nav>
        <div class="side-foot" th:if="${crmUrl != null}">
            <a th:href="${crmUrl}"><th:block th:utext="${i16['arrow-left']}"></th:block>Вернуться в CRM</a>
            <span th:text="${crmPass ? 'вход из CRM · пропуск владельца' : 'админка производства'}"></span>
        </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
        <header class="bar">
            <button class="burger" type="button" id="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="side" th:utext="${i['menu']}"></button>
            <div class="bar-t"><h1 th:text="${title}">Дашборд</h1><p th:if="${sub != null}" th:text="${sub}"></p></div>
            <form class="scope" th:if="${v.owner()}" action="/admin/scope" method="get">
                <label for="scope-sel">Компания</label>
                <select id="scope-sel" name="company">
                    <option value="all" th:selected="${v.isAll()}">Все компании</option>
                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == v.companyId()}">Компания</option>
                </select>
                <input type="hidden" name="back" th:value="${here}">
                <noscript><button class="btn btn-soft btn-sm" type="submit">Показать</button></noscript>
            </form>
            <span class="tag" th:unless="${v.owner()}" th:text="${v.scopeName()}">Компания</span>
            <form class="bar-search" action="/admin/find" method="get" role="search">
                <th:block th:utext="${i16['search']}"></th:block>
                <input type="search" name="q" placeholder="Магазин, № заказа, телефон" aria-label="Магазин, № заказа, телефон">
            </form>
            <details class="me">
                <summary><span class="ava" aria-hidden="true" th:text="${v.me().initial}">В</span><span class="me-n"><b th:text="${v.me().name}">Владелец</b><th:block th:text="${v.owner() ? 'все компании' : v.role().label.toLowerCase()}">роль</th:block></span><span class="sr">Меню пользователя</span></summary>
                <div class="me-pop">
                    <th:block th:if="${v.owner()}">
                        <p>Чтобы проверить, что видит каждая роль, откройте админку её глазами. Действия всё равно записываются на вас.</p>
                        <h4>Смотреть как</h4>
                        <a th:each="r : ${roles}" th:href="@{/admin/as(role=${r},back=${here})}" th:attr="aria-current=${r == v.role()} ? 'true' : null"><th:block th:text="${r.label}">Роль</th:block><span th:text="${r.hint}"></span></a>
                        <hr>
                    </th:block>
                    <a href="/password">Сменить пароль</a>
                    <form th:action="@{/logout}" method="post"><button type="submit">Выйти</button></form>
                </div>
            </details>
        </header>
        <main class="view" id="view">
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden th:text="${toast}"></div>
<script src="/admin/assets/admin.js?v=5"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
