spring.application.name=distribution
server.port=8090

# За nginx (X-Forwarded-*), как в CRM.
server.forward-headers-strategy=framework

# Даты в ссылках шаблонов — в ISO (2026-10-28), не по языку браузера.
spring.mvc.format.date=iso

# Своё имя cookie сессии: у CRM тоже JSESSIONID, а браузер хранит cookie по адресу без порта —
# на localhost две системы выбивали бы друг друга из входа.
server.servlet.session.cookie.name=DISTRIBUTION_SESSION

# Шаблоны правятся без перезапуска при `gradlew bootRun` (devtools).
spring.thymeleaf.cache=false

# Секреты — только из переменных окружения. Для разработки их можно положить в .env рядом с
# проектом (не в git, пример — .env.example) или в application-local.properties (профиль local).
spring.config.import=optional:file:.env[.properties]

# База: PostgreSQL 16 (docker-compose.yml). Схема — только миграциями Flyway (db/migration),
# Hibernate лишь сверяет сущности со схемой.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5436/distribution}
spring.datasource.username=${DB_USER:distribution}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
# Шаблоны ходят по связям (заказ → магазин → маршрут → агент): сессия открыта до конца страницы.
spring.jpa.open-in-view=true
# Связи списков подгружаются пачками, а не по одной строке.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Приложение агента и экспедитора (/api/mobile): JWT живёт 12 часов, дальше телефон сам берёт новый по ключу
# устройства. Ключ подписи — JWT_SECRET (не короче 32 знаков); не задан — случайный при каждом запуске
# (после перезапуска телефоны просто возьмут новый JWT по ключу устройства).
distribution.jwt.secret=${JWT_SECRET:}
distribution.jwt.ttl-minutes=720
