<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<div class="acts">
    <a class="back" href="/admin/trips"><th:block th:utext="${i16['back']}"></th:block>Рейсы</a>
    <span style="flex:1"></span>
    <span class="st" th:classappend="${'st--' + t.status.badge}" th:text="${t.status.label}"></span>
    <a class="btn btn-primary btn-sm" th:if="${t.open and !t.date.isAfter(today)}" th:href="${'/admin/cash/' + t.id}">Принять кассу</a>
</div>
<section class="kpis">
    <div class="kpi"><span class="kpi-l">Точки</span><span class="kpi-v num" th:text="${t.doneStops + ' / ' + t.stops}"></span><span class="kpi-s" th:text="${t.progress + '% пройдено'}"></span></div>
    <div class="kpi"><span class="kpi-l">Загружено</span><span class="kpi-v num" th:text="${@fmt.money(t.loadedTotal)}"></span></div>
    <div class="kpi"><span class="kpi-l">Выдано</span><span class="kpi-v num" th:text="${@fmt.money(t.deliveredTotal)}"></span></div>
    <div class="kpi kpi--main"><span class="kpi-l">Наличные</span><span class="kpi-v num" th:text="${@fmt.money(t.cash)}"></span><span class="kpi-s" th:text="${'в т.ч. старые долги ' + @fmt.money(t.oldDebtCollected)}"></span></div>
    <div class="kpi"><span class="kpi-l">Kaspi · в долг</span><span class="kpi-v num" th:text="${@fmt.money(t.kaspi)}"></span><span class="kpi-s" th:text="${'в долг ' + @fmt.money(t.credit)}"></span></div>
    <div class="kpi"><span class="kpi-l">Возвраты негодного</span><span class="kpi-v num" th:text="${@fmt.money(t.returnsTotal)}"></span><span class="kpi-s" th:text="${t.returnsQty + ' шт'}"></span></div>
</section>
<div class="grid-wide">
    <section class="card">
        <div class="card-h"><h2>Точки по порядку</h2></div>
        <div class="tbl-w"><table class="tbl tbl--cards">
            <thead><tr><th>#</th><th>Магазин</th><th>Заказ</th><th class="r">Сумма</th><th class="r">Выдано</th><th>Оплата</th><th>Статус</th></tr></thead>
            <tbody><tr th:each="o, it : ${t.orders}">
                <td class="num muted hide-m" th:text="${it.count}"></td>
                <td><a class="rl" th:href="${'/admin/outlets/' + o.outlet.id}" th:text="${o.outlet.name}"></a><span class="sub" th:text="${o.outlet.address}"></span></td>
                <td class="hide-m"><a class="link" th:href="${'/admin/orders/' + o.id}" th:text="${'№ ' + o.number}"></a></td>
                <td class="r num hide-m" th:text="${@fmt.money(o.total)}"></td>
                <td class="r num" th:text="${o.status.delivered() ? @fmt.money(o.deliveredTotal) : '—'}"></td>
                <td class="hide-m" th:text="${o.payment.label}"></td>
                <td><span class="st" th:classappend="${'st--' + o.status.badge}" th:text="${o.status.label}"></span></td>
            </tr></tbody>
        </table></div>
    </section>
    <section class="card">
        <div class="card-h"><h2>Загрузка машины</h2><button class="btn btn-soft btn-sm" type="button" onclick="window.print()">Печать</button></div>
        <div class="tbl-w"><table class="tbl">
            <thead><tr><th>Товар</th><th class="r">Шт</th></tr></thead>
            <tbody><tr th:each="r : ${rows}"><td th:text="${r.product().name}"></td><td class="r num" th:text="${r.qty()}"></td></tr></tbody>
        </table></div>
    </section>
</div>
</th:block>
</body>
</html>
