<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>База магазинов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4136F1}a:hover{color:#3329D6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F5F7; color: #101318; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column;">

  <div style="flex: none; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em;">Магазины</h1>
        <div style="font-size: 14px; line-height: 20px; color: #5C6370;">312 в базе · ближние сверху</div>
      </div>
      <a href="AgentNewOutlet.dc.html" style="flex: none; height: 44px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 22px; background: #4136F1; color: #FFFFFF; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 600; box-shadow: 0 8px 18px -8px rgba(65,54,241,0.6);">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Новый
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6370" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <label for="s" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Поиск магазина</label>
        <input id="s" type="search" autocomplete="off" placeholder="Название, адрес, телефон" value="{{ q }}" onChange="{{ onQ }}" style="flex: 1 1 auto; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px 0 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); font: 400 16px/1 'Inter', -apple-system, sans-serif; color: #101318;">
      </div>
      <a href="AgentShopsMap.dc.html" style="flex: none; height: 48px; box-sizing: border-box; padding: 0 15px 0 12px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); color: #101318; display: flex; align-items: center; gap: 7px; text-decoration: none; font-size: 15px; font-weight: 600;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#101318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"></path><path d="M9 4v14M15 6v14"></path></svg>
        Карта
      </a>
    </div>

    <div role="group" aria-label="Фильтр" style="margin: 0 -16px; padding: 0 16px; display: flex; gap: 6px; overflow-x: auto;">
      <button type="button" aria-pressed="{{ f1on }}" onClick="{{ f1pick }}" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ f1border }}; border-radius: 18px; background: {{ f1bg }}; color: {{ f1color }}; font: 600 14px/1 'Inter', -apple-system, sans-serif; white-space: nowrap; cursor: pointer;">Рядом</button>
      <button type="button" aria-pressed="{{ f2on }}" onClick="{{ f2pick }}" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ f2border }}; border-radius: 18px; background: {{ f2bg }}; color: {{ f2color }}; font: 600 14px/1 'Inter', -apple-system, sans-serif; white-space: nowrap; cursor: pointer;">С долгом</button>
      <button type="button" aria-pressed="{{ f3on }}" onClick="{{ f3pick }}" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ f3border }}; border-radius: 18px; background: {{ f3bg }}; color: {{ f3color }}; font: 600 14px/1 'Inter', -apple-system, sans-serif; white-space: nowrap; cursor: pointer;">Просрочка</button>
      <button type="button" aria-pressed="{{ f4on }}" onClick="{{ f4pick }}" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ f4border }}; border-radius: 18px; background: {{ f4bg }}; color: {{ f4color }}; font: 600 14px/1 'Inter', -apple-system, sans-serif; white-space: nowrap; cursor: pointer;">Новые</button>
    </div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 12px 16px 104px;">
    <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Магазины" style="border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); overflow: hidden;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <a href="{{ r.href }}" style="min-height: 64px; box-sizing: border-box; padding: 10px 12px 10px 16px; border-top: {{ r.border }}; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #101318;">
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 600;">{{ r.name }}</span>
              <span style="font-size: 13px; color: #5C6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.addr }}</span>
            </span>
            <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
              <span style="font-size: 13px; font-weight: 600; color: #5C6370; white-space: nowrap; font-variant-numeric: tabular-nums;">{{ r.dist }}</span>
              <span style="height: 20px; box-sizing: border-box; padding: 0 7px; border-radius: 5px; background: {{ r.chipBg }}; color: {{ r.chipColor }}; font-size: 11px; font-weight: 600; display: {{ r.chipShow }}; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums;">{{ r.chip }}</span>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-if>
    <sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}">
      <div style="box-sizing: border-box; padding: 20px 16px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-size: 14px; line-height: 20px; color: #5C6370;">
        Такого магазина нет в базе
        <a href="AgentNewOutlet.dc.html" style="height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #EEEDFE; color: #3329D6; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600;">Создать новый магазин</a>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 26px; background: #FFFFFF; border-top: 1px solid #E8EAEE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <a href="AgentToday.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"></path></svg>
      Сегодня
    </a>
    <a href="AgentOrders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      Заказы
    </a>
    <a href="AgentShopsMap.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #4136F1; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5"></path><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"></path><path d="M5 11.5V20h14v-8.5M10 20v-5h4v5"></path></svg>
      Магазины
    </a>
    <a href="AgentProfile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Профиль
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { f: 'near', q: '' };
}
renderVals() {
const DB = [
{ name: 'Магазин «Нур»', addr: 'ул. Абая, 41 · Айжан К.', m: 18, debt: 48200, overdue: 12000 },
{ name: 'Магазин «Мерей»', addr: 'ул. Абая, 52 · Гульнара М.', m: 140, debt: 0 },
{ name: 'Магазин «Алтын»', addr: 'ул. Абая, 77 · Марат Е.', m: 260, debt: 61000, overdue: 32000, blocked: true },
{ name: 'Магазин «Шанырак»', addr: 'ул. Байтурсынова, 21', m: 410, debt: 22300 },
{ name: 'Магазин «Улан»', addr: 'ул. Момышулы, 8', m: 520, debt: 0 },
{ name: 'Магазин «Айгуль»', addr: 'ул. Толе би, 104', m: 690, debt: 0 },
{ name: 'Магазин «Береке-2»', addr: 'ул. Сейфуллина, 40 · напротив школы', m: 1100, debt: 0, fresh: true },
{ name: 'Магазин «Достык»', addr: 'ул. Желтоксан, 22 · Ерлан Б.', m: 1700, debt: 15400 },
{ name: 'Магазин «Арман»', addr: 'пр. Республики, 63', m: 2000, debt: 9800 },
{ name: 'Магазин «Сая»', addr: 'ул. Сейфуллина, 5', m: 2600, debt: 15600, overdue: 4200 },
{ name: 'Магазин «Камила»', addr: 'ул. Аль-Фараби, 19', m: 3000, debt: 0 },
{ name: 'Магазин «Тумар»', addr: 'ул. Кунаева, 40', m: 3600, debt: 4500 }
];
const FILTERS = ['near', 'debt', 'overdue', 'fresh'];
const group = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const distText = (m) => m < 1000 ? m + ' м' : (Math.round(m / 100) / 10).toString().replace('.', ',') + ' км';
const st = this.state;
const f = st.f || 'near';
const q = (st.q || '').trim().toLowerCase();
const test = {
near: () => true,
debt: (s) => s.debt > 0,
overdue: (s) => (s.overdue || 0) > 0,
fresh: (s) => !!s.fresh
};
const list = DB.filter(test[f]).filter((s) => !q || (s.name + ' ' + s.addr).toLowerCase().indexOf(q) >= 0);
const rows = list.map((s, i) => {
let chip = '', bg = '#F1F2F5', color = '#3D434D';
if (s.blocked) { chip = 'Заказ закрыт'; bg = '#FDECEA'; color = '#A3241A'; }
else if (s.fresh) { chip = 'На проверке'; bg = '#EEEDFE'; color = '#3329D6'; }
else if (s.overdue) { chip = 'Просрочено ' + group(s.overdue) + ' ₸'; bg = '#FFF4DF'; color = '#8A5000'; }
else if (s.debt) { chip = 'Долг ' + group(s.debt) + ' ₸'; }
return {
name: s.name,
addr: s.addr,
dist: distText(s.m),
chip: chip,
chipShow: chip ? 'inline-flex' : 'none',
chipBg: bg,
chipColor: color,
border: i === 0 ? '0' : '1px solid #EDEFF2',
href: s.blocked ? 'AgentBlocked.dc.html' : 'AgentOutlet.dc.html'
};
});
const vals = {};
FILTERS.forEach((k, i) => {
const on = k === f;
const p = 'f' + (i + 1);
vals[p + 'on'] = on ? 'true' : 'false';
vals[p + 'bg'] = on ? '#101318' : '#FFFFFF';
vals[p + 'color'] = on ? '#FFFFFF' : '#101318';
vals[p + 'border'] = on ? '#101318' : '#E1E4EA';
vals[p + 'pick'] = () => this.setState({ f: k });
});
return Object.assign(vals, {
q: st.q || '',
onQ: (e) => this.setState({ q: String((e && e.target && e.target.value) || '').slice(0, 40) }),
rows: rows,
hasRows: rows.length > 0,
noRows: rows.length === 0
});
}
}
</script>
</body>
</html>
