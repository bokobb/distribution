<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Визит без заказа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4136F1}a:hover{color:#3329D6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F5F7; color: #101318; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.4;">

  <div style="box-sizing: border-box; padding: 52px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="height: 44px; display: flex; align-items: center; gap: 12px;">
      <a href="AgentOutlet.dc.html" aria-label="Назад к визиту" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.08); display: flex; align-items: center; justify-content: center;">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101318" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 8.5 12l6.5 6.5"></path></svg>
      </a>
      <span style="font-size: 17px; font-weight: 600;">Без заказа</span>
    </div>

    <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em;">Магазин «Нур»</h1>
      <div style="font-size: 15px; line-height: 21px; color: #5C6370;">Почему сегодня без заказа?</div>
    </div>

    <div role="radiogroup" aria-label="Причина" style="box-sizing: border-box; padding: 4px 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); display: flex; flex-direction: column;">
      <sc-for list="{{ reasons }}" as="r" hint-placeholder-count="6">
        <button type="button" role="radio" aria-checked="{{ r.checked }}" onClick="{{ r.pick }}" style="width: 100%; min-height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 1px solid {{ r.line }}; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; font: {{ r.weight }} 15px/1.3 'Inter', -apple-system, sans-serif; color: #101318; text-align: left; cursor: pointer;">
          {{ r.label }}
          <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: {{ r.ring }}; background: #FFFFFF;"></span>
        </button>
      </sc-for>
    </div>

    <button type="button" style="height: 92px; box-sizing: border-box; border: 1.5px dashed #C9CDD5; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font: 600 15px/1.3 'Inter', -apple-system, sans-serif; color: #101318; cursor: pointer;">
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #F1F2F5; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101318" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
        Сфотографировать полку
        <span style="font-size: 12px; font-weight: 600; color: #8A5000;">Обязательно для этого магазина</span>
      </span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="cmt" style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #3D434D;">Комментарий</label>
      <textarea id="cmt" rows="2" placeholder="Необязательно: когда зайти снова" style="height: 72px; box-sizing: border-box; padding: 12px 14px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); resize: none; font: 400 15px/1.4 'Inter', -apple-system, sans-serif; color: #101318;"></textarea>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 30px; background: #FFFFFF; border-top: 1px solid #E8EAEE;">
    <a href="AgentToday.dc.html" style="height: 54px; border-radius: 14px; background: #4136F1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600;">Завершить визит</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: 0 };
}
renderVals() {
const R = ['Товар ещё есть', 'Нет денег', 'Хозяина нет на месте', 'Магазин закрыт', 'Берёт у другого поставщика', 'Другая причина'];
const sel = this.state.pick;
return {
reasons: R.map((label, i) => ({
label: label,
checked: i === sel ? 'true' : 'false',
line: i === 0 ? 'transparent' : '#EDEFF2',
weight: i === sel ? '600' : '400',
ring: i === sel ? '7px solid #4136F1' : '2px solid #C9CDD5',
pick: () => this.setState({ pick: i })
}))
};
}
}
</script>
</body>
</html>
