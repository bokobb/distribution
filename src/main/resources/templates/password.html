<!DOCTYPE html>
<!--/* Смена пароля. Сотрудник с временным паролем попадает сюда, пока не сменит его. */-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Смена пароля — Юг Доставка</title>
    <link rel="icon" href="/admin/assets/logo-64.png" type="image/png">
    <link rel="apple-touch-icon" href="/admin/assets/logo-192.png">
    <link rel="stylesheet" href="/admin/assets/admin.css?v=5">
</head>
<body>
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px var(--gut)">
    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px">
        <div>
            <h1 style="font-size:24px;line-height:32px">Смена пароля</h1>
            <p class="muted" th:text="${forced ? 'Вам выдан временный пароль — придумайте свой, чтобы продолжить.' : 'Не короче 8 знаков.'}"></p>
        </div>
        <p class="note note--bad" role="alert" th:if="${error != null}" th:text="${error}"></p>
        <form class="card" th:action="@{/password}" method="post">
            <div class="card-b" style="display:flex;flex-direction:column;gap:16px;padding-top:18px">
                <label class="field"><span th:text="${forced ? 'Временный пароль' : 'Текущий пароль'}">Текущий пароль</span><input class="inp" name="current" type="password" required autocomplete="current-password"></label>
                <label class="field">Новый пароль<input class="inp" name="password" type="password" required minlength="8" autocomplete="new-password"><span class="hint">не короче 8 знаков, не номер телефона</span></label>
                <label class="field">Повторите новый пароль<input class="inp" name="confirm" type="password" required minlength="8" autocomplete="new-password"></label>
                <div class="acts">
                    <button class="btn btn-primary" type="submit">Сохранить пароль</button>
                    <a class="btn btn-soft" href="/admin" th:unless="${forced}">Отмена</a>
                </div>
            </div>
        </form>
        <form th:action="@{/logout}" method="post"><button class="btn btn-soft btn-sm" type="submit">Выйти</button></form>
    </div>
</main>
</body>
</html>
