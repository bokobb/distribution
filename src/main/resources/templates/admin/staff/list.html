<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<p th:replace="~{admin/parts :: issued}"></p>
<div class="tools">
    <nav class="tabs" aria-label="Команда" style="flex:1">
        <a href="/admin/staff" th:attr="aria-current=${tab == 'people'} ? 'true' : null" th:text="${'Сотрудники · ' + people.size()}">Сотрудники</a>
        <a href="/admin/staff?tab=vehicles" th:attr="aria-current=${tab == 'vehicles'} ? 'true' : null" th:text="${'Машины · ' + vehicles.size()}">Машины</a>
    </nav>
    <a class="btn btn-primary btn-sm" th:href="${tab == 'vehicles' ? '/admin/staff/vehicles/new' : '/admin/staff/new'}"><th:block th:utext="${i16['plus']}"></th:block>Добавить</a>
</div>

<section class="card" th:if="${tab == 'people'}">
    <div class="card-h"><div><h2>Сотрудники</h2><p th:text="${@fmt.plural(agents, 'торговый', 'торговых', 'торговых') + ', ' + @fmt.plural(expeditors, 'экспедитор', 'экспедитора', 'экспедиторов') + ' · вход в приложение по телефону, пароль выдаёт админка'}"></p></div></div>
    <div class="tbl-w"><table class="tbl tbl--cards">
        <thead><tr><th>Сотрудник</th><th>Роль</th><th class="hide-m">Магазины или машина</th><th class="hide-m">Приложение</th><th>Связь</th><th class="hide-m">Долг</th></tr></thead>
        <tbody><tr th:each="e : ${people}" th:classappend="${!e.active} ? 'is-off'" th:with="mob=${e.role.name() == 'AGENT' or e.role.name() == 'EXPEDITOR'}, ver=${versions[e.id]}">
            <td><span class="who"><span class="ava" th:text="${e.initials}"></span><span><a class="rl" th:href="${'/admin/staff/' + e.id}" th:text="${e.name}"></a>
                <span class="sub num" th:text="${@fmt.dot(@fmt.phone(e.phone), v.isAll() ? e.company.name : null, e.active ? null : 'отключён')}"></span></span></span></td>
            <td th:text="${e.role.label}"></td>
            <td class="hide-m small">
                <th:block th:if="${e.role.name() == 'AGENT'}" th:text="${@fmt.plural(outletsOf.getOrDefault(e.id, 0L), 'магазин', 'магазина', 'магазинов')}"></th:block>
                <th:block th:if="${e.vehicle != null}" th:text="${e.vehicle.plate}"></th:block>
                <th:block th:if="${e.role.name() != 'AGENT' and e.vehicle == null}">—</th:block></td>
            <td class="hide-m small">
                <th:block th:if="${mob}"><span th:text="${ver ?: 'версия неизвестна'}" th:classappend="${oldApp.contains(e.id)} ? 'warn'"></span>
                    <span class="sub" th:classappend="${e.unsent > 0} ? 'warn'" th:text="${e.unsent > 0 ? @fmt.plural(e.unsent, 'запись ждёт', 'записи ждут', 'записей ждут') + ' сети'
                        : (oldApp.contains(e.id) ? 'старая версия' : 'всё отправлено')}"></span></th:block>
                <span class="muted" th:unless="${mob}">веб-админка</span></td>
            <td class="small"><span th:if="${mob}" th:classappend="${e.stale} ? 'bad'" th:text="${@fmt.ago(e.lastSync)}"></span><span th:unless="${mob}" class="muted">—</span></td>
            <td class="hide-m small">
                <a class="bad" th:if="${shortages.getOrDefault(e.id, 0L) > 0}" href="/admin/cash" th:text="${'недостача ' + @fmt.money(shortages.get(e.id)) + ' ждёт решения'}"></a>
                <a class="sub bad" th:if="${debtOf.getOrDefault(e.id, 0L) > 0}" href="/admin/reports/cash" th:text="${'долг по недостачам ' + @fmt.money(debtOf.get(e.id))}"></a>
                <th:block th:if="${shortages.getOrDefault(e.id, 0L) == 0 and debtOf.getOrDefault(e.id, 0L) == 0}">—</th:block></td>
        </tr></tbody>
    </table></div>
</section>

<section class="card" th:if="${tab == 'vehicles'}">
    <div class="card-h"><h2>Машины</h2></div>
    <div class="tbl-w"><table class="tbl">
        <thead><tr><th>Гос. номер</th><th>Модель</th><th>Экспедитор</th><th th:if="${v.isAll()}">Компания</th></tr></thead>
        <tbody><tr th:each="m : ${vehicles}">
            <td class="num"><a class="rl" th:href="${'/admin/staff/vehicles/' + m.id}" th:text="${m.plate}"></a></td>
            <td th:text="${m.model}"></td>
            <td th:text="${m.expeditor == null ? '—' : m.expeditor.name}"></td>
            <td th:if="${v.isAll()}" th:text="${m.company.name}"></td>
        </tr></tbody>
    </table></div>
</section>
</th:block>
</body>
</html>
