<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мои магазины</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4136F1}a:hover{color:#3329D6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F5F7; color: #101318; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column;">

  <div style="flex: none; box-sizing: border-box; padding: 54px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em;">Магазины</h1>
        <div style="font-size: 14px; line-height: 20px; color: #5C6370;">64 магазина в ваших маршрутах</div>
      </div>
      <a href="AgentNewOutlet.dc.html" style="flex: none; height: 44px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 22px; background: #4136F1; color: #FFFFFF; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 600; box-shadow: 0 8px 18px -8px rgba(65,54,241,0.6);">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Новый
      </a>
    </div>

    <div style="position: relative; display: flex; align-items: center;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6370" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="s" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Поиск магазина</label>
      <input id="s" type="search" placeholder="Название, адрес или телефон" style="flex: 1 1 auto; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px 0 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); font: 400 16px/1 'Inter', -apple-system, sans-serif; color: #101318;">
    </div>

    <div role="group" aria-label="Фильтр" style="margin: 0 -16px; padding: 0 16px; display: flex; gap: 6px; overflow-x: auto;">
      <sc-for list="{{ filters }}" as="c" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 18px; background: {{ c.bg }}; color: {{ c.color }}; font: 600 14px/1 'Inter', -apple-system, sans-serif; white-space: nowrap; cursor: pointer;">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 12px 16px 104px;">
    <div style="border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,19,24,0.06); overflow: hidden;">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
        <div style="min-height: 64px; box-sizing: border-box; padding: 10px 16px; border-bottom: 1px solid #EDEFF2; display: flex; align-items: center; gap: 12px;">
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 15px; font-weight: 600;">{{ r.name }}</span>
            <span style="font-size: 13px; color: #5C6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.addr }}</span>
          </div>
          <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right;">
            <sc-if value="{{ r.isOver }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
                <span style="font-size: 15px; font-weight: 700; color: #B0261A; font-variant-numeric: tabular-nums;">{{ r.amount }}</span>
                <span style="font-size: 12px; font-weight: 600; color: #B0261A;">сверх лимита</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.isOverdue }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
                <span style="font-size: 15px; font-weight: 700; color: #8A5000; font-variant-numeric: tabular-nums;">{{ r.amount }}</span>
                <span style="font-size: 12px; font-weight: 600; color: #8A5000; font-variant-numeric: tabular-nums;">{{ r.note }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.isDebt }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
                <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ r.amount }}</span>
                <span style="font-size: 12px; color: #5C6370;">долг</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.isClean }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
                <span style="font-size: 13px; font-weight: 600; color: #0E6B4C;">без долга</span>
                <span style="font-size: 12px; color: #5C6370;">{{ r.note }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.isPending }}" hint-placeholder-val="{{ false }}">
              <span style="height: 22px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; background: #EEEDFE; color: #3329D6; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">На проверке</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 26px; background: #FFFFFF; border-top: 1px solid #E8EAEE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <a href="AgentToday.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.2"></circle><circle cx="18" cy="5" r="2.2"></circle><path d="M8.2 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.8"></path></svg>
      Маршрут
    </a>
    <a href="AgentOrders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      Заказы
    </a>
    <a href="AgentRoute.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #4136F1; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5"></path><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"></path><path d="M5 11.5V20h14v-8.5M10 20v-5h4v5"></path></svg>
      Магазины
    </a>
    <a href="AgentProfile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5C6370; font-size: 11px; font-weight: 600;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Профиль
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { f: 'all' };
}
renderVals() {
const O = [
{ name: 'Магазин «Алтын»', addr: 'мкр. Нурсат, 112', debt: 61000, limit: 50000, overdue: 0 },
{ name: 'Магазин «Нур»', addr: 'ул. Абая, 41', debt: 48200, limit: 50000, overdue: 12000 },
{ name: 'Магазин «Сая»', addr: 'ул. Сейфуллина, 5', debt: 15600, limit: 30000, overdue: 4200 },
{ name: 'Магазин «Шанырак»', addr: 'ул. Байтурсынова, 21', debt: 22300, limit: 50000, overdue: 0 },
{ name: 'Магазин «Береке-2»', addr: 'ул. Сейфуллина, 40', debt: 0, limit: 0, overdue: 0, pending: true },
{ name: 'Магазин «Арман»', addr: 'пр. Республики, 63', debt: 9800, limit: 50000, overdue: 0 },
{ name: 'Магазин «Тумар»', addr: 'ул. Кунаева, 40', debt: 4500, limit: 30000, overdue: 0 },
{ name: 'Магазин «Мерей»', addr: 'ул. Толе би, 17', debt: 0, limit: 50000, overdue: 0, last: 'заказ 21 окт' },
{ name: 'Магазин «Улан»', addr: 'ул. Момышулы, 8', debt: 0, limit: 50000, overdue: 0, last: 'заказ 24 окт' },
{ name: 'Магазин «Камила»', addr: 'ул. Аль-Фараби, 19', debt: 0, limit: 50000, overdue: 0, last: 'заказ 20 окт' }
];
const money = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸';
const f = this.state.f;
const test = {
all: () => true,
debt: (o) => o.debt > 0,
overdue: (o) => o.overdue > 0,
over: (o) => o.debt > o.limit && !o.pending,
pending: (o) => !!o.pending
};
const rows = O.filter(test[f]).map((o) => {
const isPending = !!o.pending;
const isOver = !isPending && o.debt > o.limit;
const isOverdue = !isPending && !isOver && o.overdue > 0;
const isDebt = !isPending && !isOver && !isOverdue && o.debt > 0;
const isClean = !isPending && o.debt === 0;
return {
name: o.name,
addr: o.addr,
amount: money(o.debt),
note: isOverdue ? 'просрочено ' + money(o.overdue) : (o.last || ''),
isOver: isOver,
isOverdue: isOverdue,
isDebt: isDebt,
isClean: isClean,
isPending: isPending
};
});
const F = [['all', 'Все · 64'], ['debt', 'С долгом · 18'], ['overdue', 'Просрочка · 6'], ['over', 'Сверх лимита · 2'], ['pending', 'На проверке · 1']];
return {
rows: rows,
filters: F.map((x) => ({
label: x[1],
pressed: x[0] === f ? 'true' : 'false',
bg: x[0] === f ? '#101318' : '#FFFFFF',
color: x[0] === f ? '#FFFFFF' : '#101318',
border: x[0] === f ? '#101318' : '#E1E4EA',
pick: () => this.setState({ f: x[0] })
}))
};
}
}
</script>
</body>
</html>
