<!DOCTYPE html>
<!--/* Приход (design/admin/AdmStock): кладовщик пересчитывает товар по строкам, разница видна сразу; расхождение из
     прихода CRM уходит в CRM. */-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<div class="acts">
    <a class="back" href="/admin/stock?tab=receipts"><th:block th:utext="${i16['back']}"></th:block>Приходы</a>
    <span th:if="${r.status.name() == 'DRAFT'}" class="st st--warn">Ждёт подтверждения</span>
    <span th:if="${r.status.name() == 'CONFIRMED' and r.diff != 0}" class="st st--bad" th:text="${'Расхождение ' + (r.diff > 0 ? '+' + r.diff : '−' + (-r.diff)) + ' шт'}"></span>
    <span th:if="${r.status.name() == 'CONFIRMED' and r.diff == 0}" class="st st--done">Принят</span>
    <span class="tag tag--crm" th:if="${r.source.name() == 'CRM'}">из CRM</span>
</div>
<p class="note note--new" th:if="${r.source.name() == 'CRM' and r.status.name() == 'DRAFT'}">Приход создан сам: заказ компании выдан в CRM. Пересчитайте товар и поправьте количество, где не сошлось, — CRM увидит разницу в заказе.</p>
<form class="card" th:action="@{'/admin/stock/receipts/' + ${r.id}}" method="post" id="receipt">
    <div class="card-h"><div><h2 th:text="${'Приход ' + r.number + (v.isAll() ? ' · ' + r.company.name : '')}">Приход</h2>
        <p th:text="${@fmt.dot(r.supplier, @fmt.day(r.date), r.basis)}"></p></div></div>
    <div class="tbl-w"><table class="tbl">
        <thead><tr><th>Товар</th><th>Код CRM</th><th class="r">По документу</th><th class="r">Принято</th><th class="r">Разница</th></tr></thead>
        <tbody><tr th:each="l : ${r.lines}" th:with="got=${l.actual ?: l.expected}">
            <td><b th:text="${l.product.name}"></b></td>
            <td><span class="tag" th:classappend="${l.product.crmCode != null} ? 'tag--crm'" th:text="${l.product.crmCode ?: '—'}"></span></td>
            <td class="r num" th:text="${l.expected}"></td>
            <td class="r">
                <input th:if="${r.status.name() == 'DRAFT'}" class="inp inp--sm" style="text-align:right" inputmode="numeric" data-expected
                       th:attr="data-expected=${l.expected}" th:name="${'qty_' + l.product.id}" th:value="${l.expected}" th:aria-label="${'Принято: ' + l.product.name}">
                <span th:unless="${r.status.name() == 'DRAFT'}" class="num" th:text="${got}"></span>
            </td>
            <td class="r num" data-diff th:classappend="${got != l.expected} ? 'bad'"
                th:text="${got == l.expected ? '—' : (got > l.expected ? '+' + (got - l.expected) : '−' + (l.expected - got))}"></td>
        </tr></tbody>
        <tfoot><tr><td colspan="2">Итого</td><td class="r num" th:text="${r.qty}"></td><td class="r num" id="got-total" th:text="${r.actualQty}"></td>
            <td class="r num" id="diff-total" th:classappend="${r.diff != 0} ? 'bad'" th:text="${r.diff == 0 ? '—' : (r.diff > 0 ? '+' + r.diff : '−' + (-r.diff))}"></td></tr></tfoot>
    </table></div>
    <div class="card-b acts" th:if="${r.status.name() == 'DRAFT'}">
        <span class="muted" id="diff-text">Всё сходится с документом</span><span style="flex:1"></span>
        <button class="btn btn-primary" type="submit">Принять на склад</button></div>
    <div class="card-b" th:unless="${r.status.name() == 'DRAFT'}"><p class="muted" th:text="${@fmt.dot('Принял: ' + (r.confirmedBy ?: '—'), r.confirmedAt == null ? null : @fmt.when(r.confirmedAt),
        r.crmOrderId == null ? null : (r.crmSentAt != null ? 'CRM знает о приёме' : 'уйдёт в CRM при следующем обмене'))}"></p></div>
</form>
<script th:if="${r.status.name() == 'DRAFT'}">
(function () {
  // разница по строке и итог — сразу при вводе
  var form = document.getElementById('receipt');
  function sign(n) { return n === 0 ? '—' : (n > 0 ? '+' + n : '−' + (-n)); }
  function sync() {
    var got = 0, diff = 0;
    form.querySelectorAll('input[data-expected]').forEach(function (i) {
      var e = parseInt(i.getAttribute('data-expected'), 10), a = parseInt(i.value, 10);
      if (isNaN(a)) a = e;
      got += a; diff += a - e;
      var cell = i.closest('tr').querySelector('[data-diff]');
      cell.textContent = sign(a - e);
      cell.classList.toggle('bad', a !== e);
    });
    document.getElementById('got-total').textContent = got;
    var t = document.getElementById('diff-total');
    t.textContent = sign(diff); t.classList.toggle('bad', diff !== 0);
    document.getElementById('diff-text').textContent = diff === 0 ? 'Всё сходится с документом'
      : 'Расхождение ' + sign(diff) + ' шт — CRM увидит его в заказе';
  }
  form.addEventListener('input', sync);
  sync();
})();
</script>
</th:block>
</body>
</html>
