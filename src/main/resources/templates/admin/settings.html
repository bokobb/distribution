<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, ~{})}">
<body>
<th:block th:fragment="content">
<p class="al al--bad" role="alert" th:if="${error != null}" th:text="${error}"></p>
<form th:action="@{/admin/settings}" method="post" style="display:flex;flex-direction:column;gap:18px">
    <section class="card">
        <div class="card-h"><h2>Визиты агентов</h2></div>
        <div class="card-b form">
            <label class="field">Радиус «на месте», метров<input class="inp" name="visitRadius" inputmode="numeric" th:value="${f.visitRadius}"><span class="hint">дальше — визит помечается</span></label>
            <label class="check"><input type="checkbox" name="shelfPhoto" value="true" th:checked="${f.shelfPhoto}">Фото полки обязательно</label>
            <label class="check"><input type="checkbox" name="refuseReason" value="true" th:checked="${f.refuseReason}">Причина отказа обязательна</label>
        </div>
    </section>
    <section class="card">
        <div class="card-h"><h2>GPS и журнал приложения</h2></div>
        <div class="card-b form">
            <label class="field">Рабочее время с<input class="inp" type="time" name="workStart" th:value="${f.workStart}"></label>
            <label class="field">до<input class="inp" type="time" name="workEnd" th:value="${f.workEnd}"><span class="hint">открыл приложение в это время — рабочий день начинается сам, без кнопки; в конце — заканчивается сам. Раньше или позже — кнопкой «Начать рабочий день»</span></label>
            <label class="field">Интервал GPS, минут<input class="inp" name="gpsInterval" inputmode="numeric" th:value="${f.gpsInterval}"><span class="hint">телефон снимает точку раз в столько минут — только в рабочий день, от «Начал день» до «Закончил день»</span></label>
            <p class="muted">Точки GPS хранятся 6 месяцев, журнал приложения — год, старше удаляются сами.</p>
        </div>
    </section>
    <section class="card">
        <div class="card-h"><h2>Заказы и долги</h2></div>
        <div class="card-b form">
            <label class="field">Доставка по умолчанию
                <select class="sel" name="deliveryDays"><option value="1" th:selected="${f.deliveryDays == 1}">на следующий день</option><option value="2" th:selected="${f.deliveryDays == 2}">через день</option></select></label>
            <label class="field">Лимит долга нового магазина, ₸<input class="inp" name="defaultLimit" inputmode="numeric" th:value="${f.defaultLimit}"></label>
            <label class="check"><input type="checkbox" name="credit" value="true" th:checked="${f.credit}">Разрешать продажу в долг</label>
            <label class="check"><input type="checkbox" name="approval" value="true" th:checked="${f.approval}">Сверх лимита — только с разрешения оператора</label>
            <label class="check"><input type="checkbox" name="discount" value="true" th:checked="${f.discount}">Агент может давать скидку</label>
        </div>
    </section>
    <section class="card">
        <div class="card-h"><h2>Касса</h2></div>
        <div class="card-b form">
            <label class="field">Допустимая разница при приёме, ₸<input class="inp" name="cashTolerance" inputmode="numeric" th:value="${f.cashTolerance}"></label>
            <label class="check"><input type="checkbox" name="kaspi" value="true" th:checked="${f.kaspi}">Принимать Kaspi</label>
        </div>
    </section>
    <section class="card">
        <div class="card-h"><h2>Связь с CRM производства</h2></div>
        <div class="card-b form">
            <label class="field">Клиент в CRM<input class="inp" name="crmClient" th:value="${f.crmClient}" placeholder="—" th:readonly="${!v.isSuper()}"><span class="hint" th:unless="${v.isSuper()}">меняет владелец</span></label>
            <label class="field">Ключ API<input class="inp" name="crmKey" type="password" value="" placeholder="выдаётся в CRM" autocomplete="off"><span class="hint">подключение — на этапе 7, пока не сохраняется</span></label>
            <label class="check"><input type="checkbox" name="autoReceipt" value="true" th:checked="${f.autoReceipt}">Создавать приход после отгрузки в CRM</label>
        </div>
    </section>
    <div class="acts"><button class="btn btn-primary" type="submit" th:disabled="${v.isAll()}">Сохранить</button></div>
</form>
</th:block>
</body>
</html>
