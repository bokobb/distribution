<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Раздел общей накладной: группы с «Итого»; общий «Итого» внизу — только если групп несколько (иначе он
     повторяет итог группы). Пустой раздел — одна строка с пояснением. */-->
<table th:fragment="waybill(sec, none)" class="wb">
    <colgroup><col style="width:6%"><col><col style="width:15%"><col style="width:10%"><col style="width:12%"><col style="width:14%"></colgroup>
    <thead><tr><th class="n">№</th><th>Наименование</th><th class="r">Блок</th><th class="r">Кол-во</th><th class="r">Цена, ₸</th><th class="r">Сумма, ₸</th></tr></thead>
    <tbody th:if="${sec.isEmpty()}"><tr><td colspan="6" class="meta" th:text="${none}"></td></tr></tbody>
    <tbody th:each="g : ${sec.groups()}">
        <tr class="grp"><td></td><td colspan="5" th:text="${g.name()}"></td></tr>
        <tr th:each="r, st : ${g.rows()}">
            <td class="n" th:text="${st.count}"></td>
            <td th:text="${r.product().name}"></td>
            <td class="r" th:text="${@fmt.blocks(r.boxes(), r.pieces())}"></td>
            <td class="r" th:text="${@fmt.amount(r.qty())}"></td>
            <td class="r" th:text="${@fmt.amount(r.price())}"></td>
            <td class="r" th:text="${@fmt.amount(r.sum())}"></td>
        </tr>
        <tr class="sub"><td></td><td>Итого</td>
            <td class="r" th:text="${@fmt.blocks(g.boxes(), g.pieces())}"></td>
            <td class="r" th:text="${@fmt.amount(g.qty())}"></td><td></td><td class="r" th:text="${@fmt.amount(g.sum())}"></td></tr>
    </tbody>
    <tfoot th:if="${sec.groups().size() > 1}"><tr><td></td><td>Итого</td>
        <td class="r" th:text="${@fmt.blocks(sec.boxes(), sec.pieces())}"></td>
        <td class="r" th:text="${@fmt.amount(sec.qty())}"></td><td></td><td class="r" th:text="${@fmt.amount(sec.sum())}"></td></tr></tfoot>
</table>
</body>
</html>
