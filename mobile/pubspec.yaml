name: distribution_mobile
description: "Приложение торгового агента и экспедитора"
publish_to: 'none'

# Версия приложения: 1.0.0 — versionName, +1 — versionCode на Android. Сервер пишет её в журнал приложения.
version: 1.0.4+5

environment:
  sdk: ^3.13.1

dependencies:
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  # Шрифт для накладной PDF: в нём есть «₸» (invoice.dart).
  assets:
    - assets/fonts/IBMPlexSans-Regular.ttf
    - assets/fonts/IBMPlexSans-SemiBold.ttf

  fonts:
    # Шрифт приложения по макетам design/mobile: кириллица и «₸», вшит для работы без сети (лицензия OFL —
    # assets/fonts/Inter-LICENSE.txt).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
